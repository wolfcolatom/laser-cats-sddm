# Licence and copyright for the files that can't carry a header
# (https://reuse.software). Everything else has SPDX lines at the top.
version = 1

[[annotations]]
path = [
    "assets/*.png", "assets/*.webp", "assets/*.svg", "preview.jpg",
    "docs/**", "ci/golden/*.png",
    "translations/*.ts", "translations/*.qm",
    "*.md", "**/*.md", ".gitignore", "theme.conf", "metadata.desktop",
    ".github/ISSUE_TEMPLATE/*.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 tom"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["assets/SpaceGrotesk.ttf", "assets/OFL-SpaceGrotesk.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors (https://github.com/floriankarsten/space-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

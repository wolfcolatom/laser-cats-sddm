[General]
# accent colour (the password field's edge starts with it)
accent=#43af9c
# calm: a gentler screen for anyone sensitive to motion (or on battery):
# no explosion or warp when you log in (it logs straight in, no 2 s wait),
# no flashing as you type, no shooting stars or comet.
#   auto   calm (and a still sky) only when there's no GPU acceleration
#   true   always calm      false   never, even without a GPU
calm=auto
# the clock and date, in Qt's date format (for example HH:mm and
# dddd d MMMM); empty follows your language and 12/24-hour setting
timeFormat=
dateFormat=
# ask for the username in a field instead of showing SDDM's list of users
# (for network accounts SDDM doesn't list; with no users listed at all the
# field appears by itself)
askUsername=false
# an on-screen keyboard button, for touch screens (needs qt6-virtualkeyboard
# and InputMethod=qtvirtualkeyboard in SDDM's own settings)
keyboard=false

# Checks on every push and pull request (the same as `make check`):
#   qml      qmllint (no warnings), the Qt Quick Test suites, headless runs
#            (normal, calm, software renderer, HiDPI, right-to-left), the
#            screenshot comparisons, and every translation
#   scripts  shellcheck, the Python tools compile, REUSE licence info
name: check

on:
  push:
  pull_request:

jobs:
  qml:
    runs-on: ubuntu-latest
    # Arch, for a current Qt 6 (the theme uses Qt 6.5+ QML features)
    container: archlinux:latest
    steps:
      - name: Install Qt 6 and tools
        run: >
          pacman -Syu --noconfirm --needed qt6-declarative qt6-svg qt6-imageformats
          qt6-tools qt6-virtualkeyboard imagemagick mesa ttf-dejavu git make
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Headless runs
        run: make smoke
      - name: Screenshot comparisons
        run: OUTDIR=visual-out make visual
      - name: Translations
        run: make i18n
      - name: Keep the pictures if they differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: visual-out/
          if-no-files-found: ignore

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck get-cats.sh ci/compare.sh
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py get-cats/*.py
      - name: REUSE licence information
        run: pipx run reuse lint

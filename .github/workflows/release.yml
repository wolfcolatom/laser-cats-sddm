# Pushing a tag like v1.6 runs the checks, then builds the release archive, its checksums and a
# build-provenance attestation, and publishes the GitHub release with that
# version's notes from CHANGELOG.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/qml.yml
    with:
      image: archlinux:base-20261122.0.629543
      snapshot: 2026/11/23

  release:
    needs: check
    runs-on: ubuntu-latest
    # the same pinned image and package snapshot as check.yml, so the archive
    # can be rebuilt bit for bit
    container: archlinux:base-20261122.0.629543
    env:
      SNAPSHOT: 2026/11/23
    steps:
      - name: Install tools
        run: |
          echo "Server = https://archive.archlinux.org/repos/$SNAPSHOT/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed qt6-tools git make tar gzip github-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^Version=//p' metadata.desktop)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but metadata.desktop says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: |
          make dist
          sha256sum "laser-cats-sddm-$VERSION.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: laser-cats-sddm-${{ env.VERSION }}.tar.gz
      - name: Release notes from CHANGELOG.md
        run: awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md && cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "laser-cats-sddm-$VERSION.tar.gz" SHA256SUMS \
            --title "Laser Cats $VERSION" --notes-file notes.md --verify-tag
